[package]
name = "worldsimulator-src"
version = "1.0.0"
description = "WorldSimulator desktop shell"
authors = ["nanoOperator"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "worldsimulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
worldsim-engine = { path = "../../crates/engine" }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
zip = "2"
tar = "0.4"
flate2 = "1"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]

