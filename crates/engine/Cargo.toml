[package]
name = "worldsim-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WorldSimulator simulation engine: world state, adaptive step loop, constraint validation, causal log, model routing."

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"], default-features = false }
quick-xml = { version = "0.31", features = ["serialize"] }
rand = "0.8"
regex = "1"

[dev-dependencies]
tempfile = "3"
