name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust targets
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend and build web UI
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          includeRelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldsimulator-${{ matrix.platform }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            app/dist
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package web build
        run: |
          mkdir -p pkg
          for d in artifacts/*/app/dist; do
            (cd "$d" && zip -r ../../../../pkg/worldsimulator-web-1.0.0.zip .)
            break
          done

      - name: Publish GitHub release with all platform apps
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            pkg/worldsimulator-web-1.0.0.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
