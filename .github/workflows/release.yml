name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must already exist)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "WorldSimulator $tag" \
              --notes "WorldSimulator $tag — local, offline alternate-history simulator."
          fi
          id=$(gh api "/repos/nanoOperator/WorldSimulator/releases/tags/$tag" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust_targets: aarch64-apple-darwin
          - os: ubuntu-latest
            name: linux-amd64
            args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb"
            rust_targets: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            name: linux-arm64
            args: "--target aarch64-unknown-linux-gnu --bundles deb"
            rust_targets: aarch64-unknown-linux-gnu
            linux_arm: "true"
          - os: windows-latest
            name: windows-amd64
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            rust_targets: x86_64-pc-windows-msvc
          - os: windows-latest
            name: windows-arm64
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
            rust_targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (amd64)
        if: matrix.os == 'ubuntu-latest' && matrix.linux_arm != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            librubberband-dev libclang-dev

      - name: Install Linux system dependencies (arm64 cross)
        if: matrix.linux_arm == 'true'
        run: |
          sudo dpkg --add-architecture arm64
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<EOF
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $VERSION_CODENAME main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $VERSION_CODENAME-updates main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $VERSION_CODENAME-security main restricted universe multiverse
EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libclang-dev \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 libssl-dev:arm64 \
            librsvg2-dev:arm64 libayatana-appindicator3-dev:arm64 \
            librubberband-dev:arm64

      - name: Configure cargo for arm64 cross
        if: matrix.linux_arm == 'true'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
EOF
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build canonical seed DB
        run: python3 data/build_seed.py

      - name: Build & bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false
